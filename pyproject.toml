[project]
name = "rimlight"
version = "0.1.0a2"
description = "Open-source driver app for USB monitor-backlight LED strips: screen mirroring, static colors, sleep/resume recovery."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Torumi", email = "iljacap@gmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "hidapi>=0.15.0",
    "numpy>=2.5.4",
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
rimlight = "rimlight.app:main"
rimlight-cli = "rimlight.cli:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "git-cliff>=2.14.2",
    "packaging>=26.3",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["typings"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["rimlight", "release_tools"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests", "packaging", "scripts"]
extraPaths = ["src", "scripts"]
stubPath = "typings"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-m 'not hardware'"
markers = [
    "hardware: needs the real LED strip plugged in; run manually with `pytest -m hardware`",
]
