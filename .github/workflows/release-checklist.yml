name: Release checklist

# Required status check "checklist": fails while a release-prep PR has unticked checklist items.
# On every other PR the job is skipped, which GitHub counts as passing.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  checklist:
    if: startsWith(github.head_ref, 'release-prep/')
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Check
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$BODY" > body.md
          uv run python -m release_tools check-checklist --body-file body.md
