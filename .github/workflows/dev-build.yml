name: Dev build

# Every push to dev produces downloadable alpha builds (workflow artifacts, not a release).

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.meta.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - id: meta
        run: echo "name=rimlight-$(uv version --short)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/build.yml
    with:
      name: ${{ needs.meta.outputs.name }}
      ref: ${{ github.sha }}
      retention-days: 14
