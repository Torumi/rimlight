name: Dev build

# Every push to dev produces downloadable alpha builds (workflow artifacts, not a release).

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.meta.outputs.name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - id: meta
        run: echo "name=rimlight-$(uv version --short)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/build.yml
    with:
      name: ${{ needs.meta.outputs.name }}
      ref: ${{ github.sha }}
      retention-days: 14
