name: PR title

# Required status check "pr-title": PRs are squash-merged, so the title becomes the commit
# message and CHANGELOG.md is generated from it (cliff.toml drops unconventional commits).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|ci|build|chore)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title is not a Conventional Commit: '$TITLE'"
            echo "Expected '<type>(<scope>)?: <description>' with type one of:"
            echo "feat, fix, perf, refactor, docs, test, ci, build, chore"
            exit 1
          fi
