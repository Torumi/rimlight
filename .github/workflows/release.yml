name: Release

# A pushed v* tag (normally from tag-release.yml) is validated again, built, and published as a
# GitHub pre-release (alpha/beta/rc) or the latest release (final/patch).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - run: uv sync --locked

      - id: check
        run: uv run python -m release_tools check-tag "$GITHUB_REF_NAME"

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      name: rimlight-${{ github.ref_name }}
      ref: ${{ github.ref_name }}

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Release notes
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            # Changes since the previous tag of any kind.
            uv run --only-dev git-cliff --ignore-tags '^$' --latest --strip all -o notes.md
          else
            # Changes since the previous stable release; pre-release tags are ignored.
            uv run --only-dev git-cliff --latest --strip all -o notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then flag=--prerelease; else flag=--latest; fi
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag "$flag"
