name: CI

on:
  pull_request:
  push:
    branches: [dev, main, "release/**"]

permissions:
  contents: read

jobs:
  # Job name and matrix make the required status checks "check (windows-latest)" and
  # "check (ubuntu-latest)" in .github/rulesets/protected-branches.json. Keep them in sync.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest
