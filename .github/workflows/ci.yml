name: CI

on:
  pull_request:
  push:
    branches: [dev, main, "release/**"]

permissions:
  contents: read

jobs:
  # Job name and matrix make the required status checks "check (windows-latest)" and
  # "check (ubuntu-latest)" in .github/rulesets/protected-branches.json. Keep them in sync.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pytest-qt imports QtGui at startup, which needs EGL/GL and friends on a bare runner.
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

  # Required status check "hooks": the git hooks from .pre-commit-config.yaml on all files, so
  # they hold even for commits made without them. Hooks that `check` already covers, and
  # no-commit-to-branch (CI runs on dev/main), are skipped.
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/prek
            .cache/tools
          key: hooks-${{ hashFiles('.pre-commit-config.yaml', 'scripts/dev_tools/**') }}

      - name: Run hooks
        run: >
          uv run --frozen prek run --all-files --show-diff-on-failure
          --skip ruff-check --skip ruff-format --skip pyright --skip pytest
          --skip no-commit-to-branch
