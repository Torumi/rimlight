name: CI

on:
  pull_request:
  push:
    branches: [dev, main, "release/**"]

permissions:
  contents: read

jobs:
  # Job name and matrix make the required status checks "check (windows-latest)" and
  # "check (ubuntu-latest)" in .github/rulesets/protected-branches.json. Keep them in sync.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      # pytest-qt imports QtGui at startup, which needs EGL/GL and friends on a bare runner.
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest
