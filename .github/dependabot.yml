# Weekly dependency updates as grouped PRs into dev. Actions are pinned by commit SHA in the
# workflows; Dependabot moves the SHA and the "# vX.Y.Z" comment together.
# PR titles must pass the pr-title check, hence the "chore(deps)" prefix. Dependabot commits are
# not signed off; dco.yml exempts them.

version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      dev-tools:
        dependency-type: development
      runtime:
        dependency-type: production
