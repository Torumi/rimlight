# git-cliff configuration: CHANGELOG.md and GitHub release notes from Conventional Commits.
# Pre-release tags are ignored here, so their commits stay under "Unreleased" until the final
# release. Release notes for a pre-release override this with `--ignore-tags '^$'`.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. Pre-releases (alpha, beta, rc)
are listed on the GitHub Releases page; this file collects them into each stable release.\n
"""
body = """
{% if version -%}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{%- endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
ignore_tags = "v[0-9]+\\.[0-9]+\\.[0-9]+(a|b|rc)[0-9]+"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
    { message = "^chore: release ", skip = true },
    { message = "^chore: bump version", skip = true },
    { message = "^chore: merge main into dev", skip = true },
    { message = "^Merge ", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Tests" },
    { message = "^(ci|build)", group = "<!-- 6 -->Build and CI" },
    { message = "^chore", group = "<!-- 7 -->Miscellaneous" },
]
