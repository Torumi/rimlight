# Git hooks, run by prek (https://prek.j178.dev); the format is pre-commit compatible.
# Install once per clone:   uv run prek install
# Run by hand:              uv run prek run            (staged files)
#                           uv run prek run --all-files
#
# Project tools run through `uv run --frozen`, so their versions come from uv.lock and match CI.
# pyright and pytest run only when the commit touches Python files. Tests marked `slow` or
# `hardware` are skipped here; CI runs everything except `hardware`.
# CI's `hooks` job runs this file on all files, skipping the hooks CI already covers.
# The commit-msg hook checks the DCO sign-off (`git commit -s`); CI's `dco` check does the same.

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^CHANGELOG\.md$ # generated by git-cliff
      - id: end-of-file-fixer
        exclude: ^CHANGELOG\.md$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: no-commit-to-branch
        args: [--branch, dev, --branch, main, --pattern, release/.*]

  - repo: local
    hooks:
      - id: no-captures
        name: no USB captures
        language: fail
        entry: USB captures stay in captures/ and are never committed; see CLAUDE.md
        files: \.(pcap|pcapng)$

      - id: ruff-check
        name: ruff check --fix
        language: system
        entry: uv run --frozen ruff check --fix --force-exclude
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run --frozen ruff format --force-exclude
        types_or: [python, pyi]

      - id: uv-lock
        name: uv lock --check
        language: system
        entry: uv lock --check
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: actionlint
        name: actionlint + shellcheck
        language: system
        entry: uv run --frozen python scripts/dev_tools/actionlint.py
        files: ^\.github/(workflows|actions)/
        pass_filenames: false

      - id: pyright
        name: pyright (whole project)
        language: system
        entry: uv run --frozen pyright
        types_or: [python, pyi]
        pass_filenames: false

      - id: pytest
        name: pytest (fast tests)
        language: system
        entry: uv run --frozen pytest -q -m "not hardware and not slow" --durations=3
        types_or: [python, pyi]
        pass_filenames: false

      - id: dco
        name: DCO sign-off
        language: system
        entry: uv run --frozen python scripts/dev_tools/dco.py commit-msg
        stages: [commit-msg]
